# The fuzz workspace of BUILD.md section 4.7, as cargo-fuzz lays it out: its own workspace, kept
# out of the root one, built with the nightly that `rust-toolchain.toml` here pins, on Linux only.
# Every target of section 4.7 is declared here, among them the three WP10 adds with its `-linux`
# crates (`linux_mountinfo`, `linux_proc_status`, `desktop_entry`). Each target calls a
# `fuzz_entry` function of the crate that owns the parser; that crate's corpus replay test runs
# the same function on every OS (on Linux only for the `-linux` crates' targets).

[package]
name = "eileen-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
eileen-apps = { path = "../crates/eileen-apps" }
eileen-apps-linux = { path = "../crates/eileen-apps-linux" }
eileen-config = { path = "../crates/eileen-config" }
eileen-contracts = { path = "../crates/eileen-contracts" }
eileen-core = { path = "../crates/eileen-core" }
eileen-dictation = { path = "../crates/eileen-dictation" }
eileen-fleet = { path = "../crates/eileen-fleet" }
eileen-harness = { path = "../crates/eileen-harness" }
eileen-hud = { path = "../crates/eileen-hud" }
eileen-intent = { path = "../crates/eileen-intent" }
eileen-mcp = { path = "../crates/eileen-mcp" }
eileen-record = { path = "../crates/eileen-record" }
eileen-replay = { path = "../crates/eileen-replay" }
eileen-runtime = { path = "../crates/eileen-runtime" }
eileen-scenarios = { path = "../crates/eileen-scenarios" }
eileen-shell-linux = { path = "../crates/eileen-shell-linux" }
eileen-sim = { path = "../crates/eileen-sim" }
eileen-skills = { path = "../crates/eileen-skills" }
eileen-speech = { path = "../crates/eileen-speech" }

