[workspace]
resolver = "3"
# Section 3.1's list is ["crates/*", "xtask", "tools/repo-tools"]. Cargo refuses a member path or
# glob that matches nothing, so each entry joins this list in the WP0 pull request that creates its
# first crate (crates/* with wp0/contracts, tools/repo-tools in phase B).
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Sixteen1-6/eileen"
publish = false

[workspace.dependencies]
# Internal crates: one line each, path = "crates/<name>", for every crate in section 3.1. Each
# line joins in the WP0 pull request that creates its crate, as `members` does: Dependabot's
# cargo updater fails the whole run on a workspace dependency whose path holds no Cargo.toml.
eileen-apps = { path = "crates/eileen-apps" }
eileen-apps-win = { path = "crates/eileen-apps-win" }
eileen-audio = { path = "crates/eileen-audio" }
eileen-audio-win = { path = "crates/eileen-audio-win" }
eileen-buildguard = { path = "crates/eileen-buildguard" }
eileen-cli = { path = "crates/eileen-cli" }
eileen-config = { path = "crates/eileen-config" }
eileen-contracts = { path = "crates/eileen-contracts" }
eileen-core = { path = "crates/eileen-core" }
eileen-crash = { path = "crates/eileen-crash" }
eileen-dbus-linux = { path = "crates/eileen-dbus-linux" }
eileen-desktop = { path = "crates/eileen-desktop" }
eileen-desktop-linux = { path = "crates/eileen-desktop-linux" }
eileen-desktop-win = { path = "crates/eileen-desktop-win" }
eileen-dictation = { path = "crates/eileen-dictation" }
eileen-e2e = { path = "crates/eileen-e2e" }
eileen-fleet = { path = "crates/eileen-fleet" }
eileen-guard = { path = "crates/eileen-guard" }
eileen-harness = { path = "crates/eileen-harness" }
eileen-hud = { path = "crates/eileen-hud" }
eileen-hud-win = { path = "crates/eileen-hud-win" }
eileen-intent = { path = "crates/eileen-intent" }
eileen-learn = { path = "crates/eileen-learn" }
eileen-mcp = { path = "crates/eileen-mcp" }
eileen-platform = { path = "crates/eileen-platform" }
eileen-record = { path = "crates/eileen-record" }
eileen-replay = { path = "crates/eileen-replay" }
eileen-rt = { path = "crates/eileen-rt" }
eileen-runtime = { path = "crates/eileen-runtime" }
eileen-scenarios = { path = "crates/eileen-scenarios" }
eileen-shell-win = { path = "crates/eileen-shell-win" }
eileen-shim = { path = "crates/eileen-shim" }
eileen-sim = { path = "crates/eileen-sim" }
eileen-skills = { path = "crates/eileen-skills" }
eileen-speech = { path = "crates/eileen-speech" }
eileen-stdx = { path = "crates/eileen-stdx" }
eileen-stub-harness = { path = "crates/eileen-stub-harness" }
eileen-supervisor = { path = "crates/eileen-supervisor" }
eileen-trace = { path = "crates/eileen-trace" }

# Async and plumbing
# tokio: 1.54.0 is yanked. RUSTSEC-2026-0386 (AsyncFd's safe constructors are unsound) affects
# 1.53.2, and 1.53.3 (2026-10-13) is its patched 1.53 release, taken inside the cooling-off period
# under section 4.1's security-patch rule. 1.54.1 (2026-10-21) waits for the cooling-off period.
# Cargo would lock 1.54.1, so the lockfile holds 1.53.3 with `cargo update -p tokio --precise 1.53.3`.
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "fs", "signal"] }
tokio-util = { version = "0.7.20", default-features = false }

# Data and contracts
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
ulid = { version = "3.0.0", default-features = false, features = ["std", "serde"] }
toml = "1.1.8"
# toml 1.1.8 does not depend on toml_edit. 0.25.15 (2026-09-11) is the newest release at least
# 14 days old on 2026-10-21, and its toml_datetime, toml_parser, toml_writer, serde_spanned and
# winnow requirements accept the versions toml 1.1.8 locks, so the tree holds one copy of each.
# Exact, so the first lock cannot take 0.25.16 or 0.25.17, both inside the cooling-off period.
toml_edit = "=0.25.15"

# Errors, tracing, secrets
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "fmt", "json", "env-filter", "std", "tracing-log", "smallvec"] }
tracing-appender = "0.2.5"
tracing-error = "0.2.1"
secrecy = "0.10.3"
await-tree = { version = "0.3.1", features = ["tokio"] }

# Storage and recording
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = { version = "1.8.7", features = ["pure"] }
zstd = "0.14.3"
hound = "3.5.1"

# Protocols
rmcp = { version = "=3.6.0", default-features = false }
agent-client-protocol = { version = "=3.4.0", default-features = false }   # declared for the ACP slot; no v0.1 crate uses it

# Processes
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }

# Windows
windows = { version = "0.62.2", default-features = false, features = [   # take core types from windows::core; never mix windows-core 0.100
  "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
  "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Registry",
  "Win32_System_Performance", "Win32_System_IO", "std",   # Win32_System_IO from process-wrap's job-object feature, std from its windows dependency, which keeps windows' default features; listed so every build has one set
  "Win32_System_DataExchange", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_NetworkManagement_IpHelper",
  "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints", "Media_Control", "Foundation", "Foundation_Collections",
] }   # WP0 starts from this list and adds what the stubs show is missing; later additions go through an amendment pull request
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects",
  "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_Storage_FileSystem", "Win32_Security",
  "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging",
  "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_IO", "Win32_Networking_WinSock", "Win32_System_IO",
  "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_System_Console",
  "Win32_System_Diagnostics_Debug", "Win32_UI_Input_KeyboardAndMouse"] }
  # buildguard (sampling, Job Object, disk; procinfo later) and tokio's dependencies (mio, socket2), plus the
  # test tools' (console, tempfile, rustix, errno, winapi-util), so a -p build, xtask and the workspace build share one set
tray-icon = { version = "0.26.1", default-features = false }   # drops the Linux libappindicator default
global-hotkey = "0.9.0"
tauri-winrt-notification = "0.8.1"
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
crash-handler = "0.8.1"
minidumper = "0.11.0"

# Linux (docs/LINUX.md): for the -linux crates. rustix 1.1.5 (2026-09-16) is already in the lock
# through tempfile; `statvfs` needs its fs feature.
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
# zbus 5.19.0 (2026-08-09, MIT) speaks D-Bus on Eileen's tokio runtime, not on its own async-io
# executor; 6.0.0 (2026-10-16) is inside the cooling-off period. Cargo's first lock would take
# releases from 2026-10-09 to 2026-10-16 for five crates of its tree, so the pull request whose
# member first uses zbus locks them with `cargo update --precise` at zbus_names 4.3.4, zvariant and
# zvariant_derive 5.15.0, uuid 1.27.0 and toml_edit 0.25.15, the workspace's own pin.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# quick-xml 0.42.0 (2026-08-22, MIT) reads GTK's recently-used.xbel; it has no default features.
quick-xml = "0.42.0"
# Not pinned: zbus-secret-service-keyring-store 1.0.1, the Secret Service store for SecretStore.
# It turns on zbus's default features, which bring back the async-io executor, so SecretStore on
# Linux waits for a store that leaves async-io off.

# Audio and speech
cpal = "0.18.2"
sonora = "0.2.0"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }   # static fails to link on MSVC 14.42
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "copy-dylibs"] }   # rc.14 and rc.15 are too new; copy-dylibs puts the DLLs beside test binaries
realfft = "3.5.0"
# rtrb: the newest non-yanked release crates.io listed on 2026-10-21 (0.4.0, released 2026-08-17;
# 0.3.5 is a later backport on the 0.3 line)
rtrb = "0.4.0"

# Images
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6.1.0"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }   # license (MIT OR Apache-2.0) AND IJG: allow IJG in deny.toml, attribution in NOTICE
base64 = "0.23.1"

# Command line and repository tools
clap = { version = "4.6.7", features = ["derive"] }
# syn: the newest 3.x release at least 14 days old on 2026-10-21 (3.0.6, released 2026-09-16;
# tools/repo-tools only)
syn = "3.0.6"

# Tests
insta = { version = "1.49.0", features = ["json", "redactions", "glob"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
proptest-state-machine = "0.9.0"
arbitrary = { version = "1.5.0", features = ["derive"] }
loom = "0.7.2"
# shuttle and shuttle-tokio: the newest releases at least 14 days old on 2026-10-21 (shuttle 0.9.5,
# released 2026-10-01, since 0.9.6 to 0.9.8 are inside the cooling-off period; shuttle-tokio 1.0.0,
# released 2026-09-04); WP2 uses them behind a `shuttle` feature no shipped binary enables.
# shuttle is exact, so the first lock cannot take 0.9.8; Dependabot still proposes exact bumps.
shuttle = "=0.9.5"
shuttle-tokio = "1.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse = "warn"
unit_bindings = "warn"
unused_macro_rules = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"        # every fallible fn returns a typed error enum that documents itself
missing_panics_doc = "allow"        # panics are denied below
multiple_crate_versions = "allow"   # windows-sys has two majors in the tree; cargo-deny reports duplicates
cargo_common_metadata = "allow"     # publish = false
use_self = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
needless_collect = "warn"
significant_drop_tightening = "warn"
significant_drop_in_scrutinee = "warn"
option_if_let_else = "allow"
missing_const_for_fn = "warn"
equatable_if_let = "warn"
debug_assert_with_mut_call = "warn"
useless_let_if_seq = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
allow_attributes = "deny"           # use #[expect(...)] so a stale suppression fails the build
allow_attributes_without_reason = "deny"
get_unwrap = "deny"
indexing_slicing = "warn"
string_slice = "deny"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "deny"
str_to_string = "warn"
lossy_float_literal = "deny"
float_cmp_const = "deny"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"
tests_outside_test_module = "warn"
unused_result_ok = "warn"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
verbose_file_reads = "warn"
mod_module_files = "deny"           # foo.rs plus foo/, never foo/mod.rs
infinite_loop = "warn"
large_include_file = "deny"
fn_to_numeric_cast_any = "deny"
if_then_some_else_none = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unseparated_literal_suffix = "warn"
wildcard_enum_match_arm = "warn"
missing_assert_message = "warn"
create_dir = "warn"
filetype_is_file = "warn"
cfg_not_test = "deny"

[profile.dev]
debug = "line-tables-only"          # useful backtraces, small PDBs

[profile.dev.package."*"]
opt-level = 2                       # audio, ONNX glue and SQLite are unusable at opt-level 0
debug = false                       # no debug info for dependencies: less link memory on a 16 GB PC

[profile.release]                   # local checks, CI smoke builds and tagged releases
opt-level = 3
lto = "thin"                        # release.yml overrides with CARGO_PROFILE_RELEASE_LTO=fat and CODEGEN_UNITS=1
panic = "unwind"                    # the core survives a panicking task
debug = "line-tables-only"
incremental = false
strip = "none"                      # MSVC keeps symbols in the .pdb, which ships to the symbol store
