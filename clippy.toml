allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false
too-many-lines-threshold = 80
too-many-arguments-threshold = 6
cognitive-complexity-threshold = 20

disallowed-methods = [
  { path = "std::thread::sleep", reason = "blocks a runtime worker; use tokio::time::sleep, or eileen_stdx::thread::sleep on a named thread" },
  { path = "std::thread::spawn", reason = "use eileen_stdx::thread::spawn_named: every thread has a name in logs and dumps" },
  { path = "std::thread::Builder::spawn", reason = "use eileen_stdx::thread::spawn_named" },
  { path = "std::env::set_var", reason = "process-global and unsound with threads" },
  { path = "std::env::remove_var", reason = "process-global and unsound with threads" },
  { path = "std::process::Command::new", reason = "start children through eileen_supervisor (Job Object, kill on close)" },
  { path = "tokio::process::Command::new", reason = "start children through eileen_supervisor", allow-invalid = true },
  { path = "std::process::exit", reason = "skips destructors and log flushing; return from main" },
  { path = "std::time::Instant::now", reason = "core logic gets time from the clock port; everything else uses eileen_stdx::clock" },
  { path = "std::time::SystemTime::now", reason = "core logic gets time from the clock port; everything else uses eileen_stdx::clock" },
  { path = "ulid::Ulid::generate", reason = "IDs come from the Ids port so replay is deterministic", allow-invalid = true },
  { path = "tokio::sync::mpsc::unbounded_channel", reason = "every queue has a maximum", allow-invalid = true },
  { path = "tokio::spawn", reason = "use eileen_rt::task::spawn: it names the task, keeps the span and registers it", allow-invalid = true },
  { path = "tokio::task::spawn", reason = "use eileen_rt::task::spawn", allow-invalid = true },
  { path = "tokio::task::spawn_blocking", reason = "use eileen_rt::task::spawn_blocking (named, bounded pool)", allow-invalid = true },
  { path = "tokio::runtime::Handle::spawn", reason = "use eileen_rt::task::spawn, inside the handle's enter() for another runtime: it names the task, keeps the span and registers it; in a -linux crate, a local task on the bridge's LocalSet (tokio::task::spawn_local inside a job)", allow-invalid = true },
  { path = "tokio::runtime::Runtime::spawn", reason = "use eileen_rt::task::spawn, inside the runtime's enter(); in a -linux crate, a local task on the bridge's LocalSet (tokio::task::spawn_local inside a job)", allow-invalid = true },
  { path = "zbus::Executor::spawn", reason = "with zbus's tokio feature this is a bare tokio::spawn; in a -linux crate run it as a local task on the bridge's LocalSet (tokio::task::spawn_local inside a job), elsewhere use eileen_rt::task::spawn" },
  { path = "await_tree::spawn", reason = "a tokio::spawn inside await-tree, without the caller's span or the panic log; use eileen_rt::task::spawn" },
  { path = "await_tree::spawn_anonymous", reason = "a tokio::spawn inside await-tree, without the caller's span or the panic log; use eileen_rt::task::spawn" },
  { path = "await_tree::spawn_derived_root", reason = "a tokio::spawn inside await-tree, without the caller's span or the panic log; use eileen_rt::task::spawn" },
  { path = "await_tree::Registry::spawn", reason = "a tokio::spawn inside await-tree, without the caller's span or the panic log; use eileen_rt::task::spawn" },
  { path = "await_tree::Registry::spawn_anonymous", reason = "a tokio::spawn inside await-tree, without the caller's span or the panic log; use eileen_rt::task::spawn" },
  { path = "await_tree::Registry::spawn_derived_root", reason = "a tokio::spawn inside await-tree, without the caller's span or the panic log; use eileen_rt::task::spawn" },
]
disallowed-types = [
  { path = "std::sync::mpsc::Sender", reason = "use bounded tokio::sync channels" },
  { path = "tokio::task::JoinSet", reason = "its spawn methods, collect and extend each start a bare tokio task; use eileen_rt::task::spawn and keep the JoinHandles; in a -linux crate, local tasks on the bridge's LocalSet (tokio::task::spawn_local inside a job)", allow-invalid = true },
]
disallowed-names = ["foo", "bar", "baz", "tmp", "data2"]
