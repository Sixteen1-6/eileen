[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eileen"
version = "0.0.1"
description = "Voice-first AI operating layer for a Windows 11 PC."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubhanshu Pokharel" }]
keywords = ["voice", "windows", "agents", "mcp", "acp", "desktop-automation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
eileen = "eileen.cli:main"

[project.urls]
Homepage = "https://github.com/Sixteen1-6/eileen"
Repository = "https://github.com/Sixteen1-6/eileen"

# Hatchling ships every file under src/eileen in the wheel, not only .py files.
# That is what carries src/eileen/policy/default.yaml and the per-package READMEs.
[tool.hatch.build.targets.wheel]
packages = ["src/eileen"]

[tool.hatch.build.targets.sdist]
include = [
  "src/eileen",
  "tests",
  "docs",
  "pyproject.toml",
  "LICENSE",
  "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
