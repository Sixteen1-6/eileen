# Check 14's credential boundary (BUILD.md sections 2.12 and 4b.3): no source names a vendor
# credential path or the persistent MCP registration command. Matched in any case and with either
# path separator, in the files with these extensions (documentation may name them to say they are
# never read).

paths = [
  ".claude/.credentials.json",
  ".credentials.json",
  ".codex/auth.json",
  ".config/gh/hosts.yml",
  ".git-credentials",
]
commands = ["claude mcp add"]
extensions = ["rs", "toml", "json", "ps1", "sh", "cmd", "bat", "py", "js", "ts", "lua", "yml", "yaml"]

[[exempt]]
path = "xtask/tidy"
reason = "these lists name what they forbid"

[[exempt]]
path = ".claude/settings.json"
reason = "denies reads of the vendor credential files, so it names them"
