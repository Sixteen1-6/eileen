# The pull request lane of BUILD.md section 4.6. `all-green` is the one required check from this
# workflow: it fails unless every blocking job succeeded or was skipped. Jobs whose inputs do not
# exist yet are absent; later work packages add them (scenarios, claude-plugin, mutants-diff).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a pull request's files through the API
    outputs:
      docs_only: ${{ steps.classes.outputs.docs_only }}
      scenarios_only: ${{ steps.classes.outputs.scenarios_only }}
      rust: ${{ steps.classes.outputs.rust }}
    steps:
      # The path classes of BUILD.md section 4.6. `cargo xtask pr-meta` reads the same classes;
      # the xtask test `ci_filters_match_the_classifier` fails if these filters drift from it.
      - name: Files that select every class
        id: every
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            every_class:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - '.github/**'
      - name: Files outside the docs and scenarios classes
        id: outside
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            not_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'
            not_scenarios:
              - '**'
              - '!scenarios/**'
      - name: Decide the lanes
        id: classes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVERY_CLASS: ${{ steps.every.outputs.every_class }}
          NOT_DOCS: ${{ steps.outside.outputs.not_docs }}
          NOT_SCENARIOS: ${{ steps.outside.outputs.not_scenarios }}
        run: |
          docs_only=false
          scenarios_only=false
          if [ "$EVENT_NAME" = pull_request ] && [ "$EVERY_CLASS" = false ]; then
            if [ "$NOT_DOCS" = false ]; then docs_only=true; fi
            if [ "$NOT_SCENARIOS" = false ]; then scenarios_only=true; fi
          fi
          rust=true
          if [ "$docs_only" = true ] || [ "$scenarios_only" = true ]; then rust=false; fi
          {
            echo "docs_only=$docs_only"
            echo "scenarios_only=$scenarios_only"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only; scenarios-only: $scenarios_only; Rust lanes: $rust"

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all --check
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Licenses, advisories, bans and sources (cargo-deny)
        run: cargo deny --locked check
      - name: Unused dependencies (cargo-machete)
        run: cargo machete

  logic-linux:
    name: logic-linux
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - name: Keep only the pinned toolchain, so the cache key does not follow the runner image
        # rust-cache hashes `rustc -vV` of every installed toolchain into its key (config.ts,
        # getRustVersions). The image's own stable toolchain changed the Linux key when an image
        # update moved it, and the next run found no cache at all. Every run of this job does this,
        # pull requests included, so they compute the key that main saved.
        shell: bash
        run: |
          pinned="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "$pinned" ]; then
            echo "::error file=rust-toolchain.toml::no channel line to read the pinned version from"
            exit 1
          fi
          rustup default "$pinned"
          installed="$(rustup toolchain list --quiet)"
          for toolchain in $installed; do
            case "$toolchain" in
              "$pinned"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done
          rustup toolchain list
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Clippy, warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Simulator pull request seeds, twice each (WP0 acceptance 7)
        # What `cargo xtask sim --doublecheck` runs; CI runners are not build-guarded.
        env:
          EILEEN_SIM_COMMIT: ${{ github.sha }} # printed with a failure's replay command
        run: cargo run --locked -p eileen-sim --bin eileen-sim -- --doublecheck
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Docs, warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logic-linux-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - name: Date the cached dependency artifacts to this save
        # On a restore that is not a full match, rust-cache deletes the entries of these folders
        # whose date is more than a week old (restore.ts, then cleanup.ts rmExcept with
        # checkTimestamp). Artifacts carried from key to key keep their first build's date, so a
        # Cargo.toml or Cargo.lock change a week later rebuilt 107 to 245 crates. Every file and
        # folder below them gets one and the same date: cargo rebuilds a unit whose dependency's
        # output is newer than its own (fingerprint/mod.rs, StaleDependency) and counts equal
        # dates as fresh, so dating only some entries, or each at its own moment, would make
        # restored build scripts and their dependents rebuild. Only main's runs save, and
        # rust-cache saves after the last step, so this is the last step and runs only there.
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          stamp="$(date +%s)"
          for dir in target/debug/build target/debug/.fingerprint target/debug/deps; do
            if [ -d "$dir" ]; then
              find "$dir" -exec touch -c -d "@$stamp" -- {} +
              echo "$dir: dated $(find "$dir" | wc -l) files and folders to @$stamp"
            fi
          done

  windows-clippy:
    name: windows-clippy
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - name: Keep only the pinned toolchain, so the cache key does not follow the runner image
        # rust-cache hashes `rustc -vV` of every installed toolchain into its key (config.ts,
        # getRustVersions). The image's own stable toolchain changed the Linux key when an image
        # update moved it, and the next run found no cache at all. Every run of this job does this,
        # pull requests included, so they compute the key that main saved.
        shell: bash
        run: |
          pinned="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "$pinned" ]; then
            echo "::error file=rust-toolchain.toml::no channel line to read the pinned version from"
            exit 1
          fi
          rustup default "$pinned"
          installed="$(rustup toolchain list --quiet)"
          for toolchain in $installed; do
            case "$toolchain" in
              "$pinned"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done
          rustup toolchain list
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: win-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the pinned native libraries and check them (cargo xtask fetch-native)
        # BUILD.md section 4.1: sherpa-onnx-sys and ort get the archive xtask checked by size and
        # SHA-256, instead of downloading their own.
        run: cargo xtask fetch-native --print-env >> "$GITHUB_ENV"
      - name: Clippy, warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Date the cached dependency artifacts to this save
        # On a restore that is not a full match, rust-cache deletes the entries of these folders
        # whose date is more than a week old (restore.ts, then cleanup.ts rmExcept with
        # checkTimestamp). Artifacts carried from key to key keep their first build's date, so a
        # Cargo.toml or Cargo.lock change a week later rebuilt 107 to 245 crates. Every file and
        # folder below them gets one and the same date: cargo rebuilds a unit whose dependency's
        # output is newer than its own (fingerprint/mod.rs, StaleDependency) and counts equal
        # dates as fresh, so dating only some entries, or each at its own moment, would make
        # restored build scripts and their dependents rebuild. Only main's runs save, and
        # rust-cache saves after the last step, so this is the last step and runs only there.
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          stamp="$(date +%s)"
          for dir in target/debug/build target/debug/.fingerprint target/debug/deps; do
            if [ -d "$dir" ]; then
              find "$dir" -exec touch -c -d "@$stamp" -- {} +
              echo "$dir: dated $(find "$dir" | wc -l) files and folders to @$stamp"
            fi
          done

  windows-test:
    name: windows-test
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - name: Keep only the pinned toolchain, so the cache key does not follow the runner image
        # rust-cache hashes `rustc -vV` of every installed toolchain into its key (config.ts,
        # getRustVersions). The image's own stable toolchain changed the Linux key when an image
        # update moved it, and the next run found no cache at all. Every run of this job does this,
        # pull requests included, so they compute the key that main saved.
        shell: bash
        run: |
          pinned="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "$pinned" ]; then
            echo "::error file=rust-toolchain.toml::no channel line to read the pinned version from"
            exit 1
          fi
          rustup default "$pinned"
          installed="$(rustup toolchain list --quiet)"
          for toolchain in $installed; do
            case "$toolchain" in
              "$pinned"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done
          rustup toolchain list
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: win-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the pinned native libraries and check them (cargo xtask fetch-native)
        # BUILD.md section 4.1: sherpa-onnx-sys and ort get the archive xtask checked by size and
        # SHA-256, instead of downloading their own.
        run: cargo xtask fetch-native --print-env >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - name: Date the cached dependency artifacts to this save
        # On a restore that is not a full match, rust-cache deletes the entries of these folders
        # whose date is more than a week old (restore.ts, then cleanup.ts rmExcept with
        # checkTimestamp). Artifacts carried from key to key keep their first build's date, so a
        # Cargo.toml or Cargo.lock change a week later rebuilt 107 to 245 crates. Every file and
        # folder below them gets one and the same date: cargo rebuilds a unit whose dependency's
        # output is newer than its own (fingerprint/mod.rs, StaleDependency) and counts equal
        # dates as fresh, so dating only some entries, or each at its own moment, would make
        # restored build scripts and their dependents rebuild. Only main's runs save, and
        # rust-cache saves after the last step, so this is the last step and runs only there.
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          stamp="$(date +%s)"
          for dir in target/debug/build target/debug/.fingerprint target/debug/deps; do
            if [ -d "$dir" ]; then
              find "$dir" -exec touch -c -d "@$stamp" -- {} +
              echo "$dir: dated $(find "$dir" | wc -l) files and folders to @$stamp"
            fi
          done

  prune-caches:
    name: prune-caches
    # Each lockfile change leaves a superseded generation of the three rust-cache entries (1.0
    # to 1.25 GB) until it goes seven days unread, which kept the repository over its 10 GB
    # cache limit, where GitHub evicts. After main's three jobs have saved, keep the newest
    # entry of each shared key and delete the rest. The Linux desktop lane restores the `linux`
    # entry kept here, and computes its key the same way (xtask::workflows::tests). Other
    # caches, such as that lane's packages, are never touched.
    # Not an all-green need: it is upkeep, and only runs where nothing waits for it.
    needs: [logic-linux, windows-clippy, windows-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # gh cache list and gh cache delete; nothing else
    steps:
      - name: Keep the newest rust-cache entry of each shared key
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for shared in linux win-clippy win-test; do
            # The key prefix alone would also match a later key such as `linux-fuzz`, so only
            # entries whose next part is rust-cache's OS name count, newest first, and the first
            # of those is kept.
            superseded="$(gh cache list --ref refs/heads/main --key "v0-rust-$shared-" \
              --sort created_at --order desc --limit 1000 --json id,key \
              --jq '.[] | "\(.id) \(.key)"' |
              { grep -E "^[0-9]+ v0-rust-$shared-(Linux|Windows_NT)-" || true; } |
              tail -n +2)"
            if [ -z "$superseded" ]; then
              echo "$shared: nothing superseded"
              continue
            fi
            while read -r id key; do
              # A concurrent push to main may have deleted it first.
              if gh cache delete "$id"; then
                echo "$shared: deleted $key"
              else
                echo "::warning::$shared: could not delete $key"
              fi
            done <<< "$superseded"
          done

  all-green:
    name: all-green
    needs: [plan, hygiene, logic-linux, windows-clippy, windows-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every blocking job succeeded or was skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }} # through the environment, never into the script
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON"
