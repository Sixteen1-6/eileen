[package]
name = "eileen-hud-win"
description = "Eileen's HUD renderer on Windows: the overlay and the strip, Raw Input clicks, capture exclusion and DWM thumbnails"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "hud"
owns = "WP8"
unsafe = "ffi"

# Windows only, as the -linux crates are Linux only: off Windows the crate is empty and has no
# dependencies.
[target.'cfg(windows)'.dependencies]
eileen-contracts.workspace = true
eileen-platform.workspace = true

[lints]
workspace = true
