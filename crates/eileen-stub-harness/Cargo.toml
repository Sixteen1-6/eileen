[package]
name = "eileen-stub-harness"
description = "A stand-in for claude -p in tests: it speaks the same stream-json and plays recorded scripts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "tests"
owns = "WP3"
unsafe = "forbid"

[[bin]]
name = "eileen-stub-harness"
path = "src/main.rs"
doc = false

[dependencies]
# The script format, `StubScriptLine`.
eileen-contracts.workspace = true
# The stdin reader's named thread, and the monotonic clock and sleep a `Delay` line uses.
eileen-stdx.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The stream-json parser and the interrupt `Requests`, which read the stub's stdout back.
eileen-harness.workspace = true
# Starts the binary as `ClaudeWorker` will.
eileen-supervisor.workspace = true
# The Redactor: every script passes through it unchanged.
eileen-trace.workspace = true
tokio.workspace = true

[lints]
workspace = true
