[package]
name = "eileen-cli"
description = "The `eileen` binary: the composition root that wires every component, and the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "core"
owns = "WP2"
unsafe = "forbid"

[[bin]]
name = "eileen"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
eileen-audio.workspace = true
eileen-config.workspace = true
eileen-fleet.workspace = true
eileen-harness.workspace = true
eileen-learn.workspace = true
eileen-record.workspace = true
eileen-replay.workspace = true
eileen-runtime.workspace = true
eileen-scenarios.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
eileen-shell-win.workspace = true

[dev-dependencies]
eileen-supervisor.workspace = true
tokio.workspace = true

[lints]
workspace = true
