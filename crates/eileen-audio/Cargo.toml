[package]
name = "eileen-audio"
description = "Eileen's audio: capture, playback and loopback, echo cancellation, the speech ring buffer and test sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "core"
owns = "WP4"
unsafe = "forbid"

# cpal is a native library of BUILD.md section 4.1, declared from W0 so its build failures show
# up before WP4 uses it; the stub does not use it yet.
[package.metadata.cargo-machete]
ignored = ["cpal"]

[features]
# `fake`, the in-memory speech transport, for other crates' tests (WP2's). Only dev-dependencies
# turn it on, so no shipped binary carries it, nor the `eileen-rt` channels it is built on.
fake = ["dep:eileen-rt"]

[dependencies]
eileen-contracts.workspace = true
eileen-rt = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
cpal.workspace = true

[dev-dependencies]
# This crate's own tests compile `fake` under `cfg(test)`, without the feature.
eileen-rt.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
