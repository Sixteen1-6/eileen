[package]
name = "eileen-record"
description = "Eileen's recordings: the recording formats on disk, the blob store, the reader, writer and trim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "core, tools"
owns = "WP1"
unsafe = "forbid"

[dependencies]
# BLAKE3 with its pure feature names each blob; zstd, vendored C, compresses it inside `blob` only
# (BUILD.md sections 3.1 and 4.1, check 24).
blake3.workspace = true
clap.workspace = true
eileen-contracts.workspace = true
serde.workspace = true
# float_roundtrip parses a float exactly, so a written line reads back to the same number
# (serde_json's default parser can be one unit in the last place off).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
