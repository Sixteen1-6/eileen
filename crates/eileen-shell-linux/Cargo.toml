[package]
name = "eileen-shell-linux"
description = "The core process's platform implementations on Linux, starting with the machine profile's facts and the memory sample"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "core"
owns = "WP10"
unsafe = "forbid"

# Linux only, as the -win crates are Windows only: off Linux the crate is empty and has no
# dependencies (docs/LINUX.md section 4).
[target.'cfg(target_os = "linux")'.dependencies]
eileen-contracts.workspace = true
eileen-dbus-linux.workspace = true
eileen-platform.workspace = true
eileen-stdx.workspace = true
rustix.workspace = true
thiserror.workspace = true
tokio.workspace = true
# zbus 6 puts its client API behind `proxy` and its object server, which the tray serves on,
# behind `service`; the workspace entry turns its default features off.
zbus = { workspace = true, features = ["proxy", "service"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
eileen-dbus-linux = { workspace = true, features = ["private-bus"] }
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
