# The modules of eileen-contracts (BUILD.md section 3.3) and whether their snapshots are pinned.
#
# The modules on slice S1's path are pinned from WP0 on: a change to their snapshot is an
# amendment to BUILD.md. A provisional module compiles and is snapshot-tested from WP0 on, but
# the package named in `pinned_by` may change it without an amendment until its first pull
# request pins it (it then sets `provisional = false` and removes the module doc's
# "Provisional:" line). The test `it::modules::modules_toml_matches_the_crate` keeps this file,
# the schema catalogue and the module docs in step.

[modules.ids]
file = "src/ids.rs"
provisional = false

