# Plain strings reachable from Input, ToolResult and DesktopState (BUILD.md section 3.3.1,
# check 26), each with the reason it is not Untrusted or Personal text. The test
# `it::text::free_text_is_wrapped_or_allowlisted` fails on a free-text string missing here and on
# an entry that no longer matches. Paths: the definition, then property names (an enum variant
# appears as its tag), `[]` for array items, `[n]` for tuple members and `{}` for map values.
#
# Kept short on purpose: a string from a page, a file, a tool or a model is wrapped, not listed.

[allow]
# Identifiers and names from the vendor CLI's own protocol (stream-json, hooks), not its text.
"BrainEvent.ready.model" = "the resolved model id the brain driver reports"
"WorkerEvent.init.session_id" = "the vendor CLI's session id"
"WorkerEvent.init.model" = "the resolved model id from system/init"
"WorkerEvent.init.tools[]" = "tool names from system/init, compared with the session's --tools list"
"WorkerEvent.init.mcp_servers[]" = "MCP server names and status from system/init"
"WorkerEvent.init.plugins[]" = "plugin names from system/init, checked against the snapshot manifest"
"WorkerEvent.init.capabilities[]" = "capability flags from system/init, feature-detected by WP3"
"WorkerEvent.tool_use.name" = "a tool name, enum-like"
"WorkerEvent.tool_use.tool_use_id" = "the vendor's id for a tool use"
"WorkerEvent.tool_result.tool_use_id" = "the vendor's id for a tool use"
"WorkerEvent.skill_invoked.name" = "a skill name, checked against the session's snapshot"
"HookRequest.pre_tool_use.tool_name" = "a tool name, enum-like, tiered by claude_tool_tier"
"HookRequest.pre_tool_use.tool_use_id" = "the vendor's id for a tool use"
"HookRequest.permission_request.tool_name" = "a tool name, enum-like"
"HookRequest.permission_request.tool_use_id" = "the vendor's id for a tool use"
"HookRequest.permission_denied.tool_name" = "a tool name, enum-like"
"HookRequest.post_tool_use_failure.tool_name" = "a tool name, enum-like"
"HookRequest.notification.kind" = "the hook's notification kind, enum-like"

# Facts the runtime adds about a call; the values they describe are wrapped beside them.
"PathFact.arg" = "the name of the argument the path came from"
"UrlFact.arg" = "the name of the argument the URL came from"
"UrlFact.host" = "the host the runtime parsed from the wrapped URL, compared by the URL rule"
"ToolCallRequest.traceparent" = "a W3C traceparent value, parsed and checked before use"

# Tool results: media types, encodings and Eileen's own verification kinds.
"Content.image.mime" = "an image media type, set by Eileen's own capture code"
"Content.image.base64" = "image bytes in base64, never read as text"
"Verification.kind" = "the kind of check Eileen's server ran, enum-like"

# Eileen's own connectors: manifests and tool specs written in Eileen's code.
"ConnectorManifest.version" = "the sidecar's own version string"
"ConnectorManifest.events[]" = "event kind names the sidecar declares, enum-like"
"ConnectorManifest.checks[][1]" = "an op tag of a check pair, enum-like"
"RunsIn.sidecar.binary" = "the sidecar's executable name, from Eileen's install folder"
"ToolSpec.description" = "a tool description written in Eileen's code for the model"
"ToolSpec.selector" = "the argument field that names the op, enum-like"
"ToolSpec.schema_hash" = "a BLAKE3 hex digest"
"OpSpec.op" = "an op tag, enum-like"
"OpSpec.inverse" = "how the journal reverses the op, written in Eileen's code"
"ConnectorEvent.app.app" = "a key of Eileen's app index"
"AppEvent.render_started.render_job" = "the app's render job id"
"AppEvent.render_progress.render_job" = "the app's render job id"
"AppEvent.render_done.render_job" = "the app's render job id"
"AppEvent.version_changed.version" = "the app's version string, read from the app itself"

# The desktop: operating-system facts, not page or document text.
"Monitor.device_path" = "the display's device path from the OS, for example \\\\.\\DISPLAY1"
"Monitor.friendly_name" = "the display's model name from its EDID, through the OS"
"WindowInfo.process" = "the window's executable name"
"WindowInfo.class" = "the window class name"
"WindowInfo.exe_version" = "the executable's file version"
"ElementInfo.control_type" = "a UI Automation control type name, enum-like"
"ElementInfo.automation_id" = "a UI Automation id the app's developer set, an identifier"
"ElementInfo.patterns[]" = "UI Automation pattern names, enum-like"
"DesktopState.degraded[]" = "names of DesktopState fields that timed out"
"MediaState.session" = "the media session's id from the OS"
"MediaState.app" = "the app id that owns the media session"

# Jobs: names Eileen made, ids, and the dispatched task.
"Job.name" = "the job's spoken name, generated by Eileen"
"Job.slug" = "the job's name as a slug, generated by Eileen"
"Job.model" = "the resolved model id"
"Job.branch" = "the job's branch name, generated by Eileen"
"Job.snapshot_ref" = "a snapshot reference Eileen created"
"JobSpec.model" = "a model name from routing.models, or a full model id"
"JobSpec.resume_session" = "a vendor session id to resume"
"JobSpec.task" = "the dispatched task: the worker's instruction from an addressed turn, checked by the dispatcher (authorized_by) and the URL rule"
"JobSpec.subtasks[]" = "split-mode subtasks, dispatched and checked with the task"
"JobSpec.subquestions[]" = "deep-answer subquestions, dispatched and checked with the task"
"JobSpec.title_hint" = "a hint for the spoken name, from the same dispatch"
"JobSpec.topic" = "a short topic key that scopes feedback facts and the answers cache"
"Grant.summary" = "the summary Eileen showed when the user granted it"
"GrantMatcher.exact_call.tool" = "a tool name, enum-like"
"GrantMatcher.exact_call.input_digest" = "a digest of the normalised call"
"GrantMatcher.tool_pattern.pattern" = "a tool pattern from the user's grant"
"GrantMatcher.desktop_app.process" = "an executable name"

# Settings and the speech process: Eileen's own sentences and keys.
"HudInput.set_setting.key" = "a setting key, validated by the settings flow"
"CheckResult.detail" = "the sentence Eileen's own check wrote"
"SpeechCheck.unavailable.reason" = "the sentence Eileen's speech process wrote"

# The learning store (WP7 decides any wrapping when it pins the learn module): text the
# librarian proposed is linted and its provenance computed by eileen-skills before it is stored
# (section 2.10), and ids, keys and statistics are Eileen's own.
"SkillMeta.description" = "learned skill text, linted and provenance-checked before it is stored"
"SkillMeta.triggers[]" = "trigger templates, parsed and linted by eileen-skills::template"
"SkillMeta.phrasings[]" = "confirmed phrasings, from the user's own confirmed turns"
"SkillMeta.facts_used[]" = "ids of facts in the learning store"
"SkillMeta.apps[][0]" = "a key of Eileen's app index"
"SkillMeta.apps[][1]" = "a version range the recipe was proven on"
"SkillMeta.tool_hashes[][1]" = "a BLAKE3 hex digest"
"SlotSpec.name" = "a slot name, linted"
"SlotKind.choice.options[]" = "choice options, literals the linter traced to their source"
"RecipeStep.id" = "a recipe step id, linted"
"StepKind.call.op" = "an op tag, enum-like"
"StepKind.ask.question" = "a recipe literal the linter traced to its source (section 2.10 item 9)"
"StepKind.ask.slot" = "a slot name, linted"
"StepKind.confirm.question" = "a recipe literal the linter traced to its source (section 2.10 item 9)"
"StepKind.delegate.goal" = "a recipe literal the linter traced to its source (section 2.10 item 9)"
"Check.op" = "an op tag, enum-like"
"Check.path" = "a JSON pointer, typed by the linter against the op's output schema"
"Operand.$slot" = "a slot name"
"Operand.$step" = "a recipe step id"
"Operand.ptr" = "a JSON pointer, typed by the linter"
"LintError.rule" = "a lint rule id"
"LintError.step" = "a recipe step id"
"LintError.message" = "the sentence Eileen's linter wrote"
"PhrasingFact.id" = "a phrasing id"
"PhrasingFact.subject" = "a subject key from the user's own words"
"PhrasingTarget.grammar_entry.id" = "a grammar entry id"
"UserFact.id" = "the learning store's id for the fact"
"UserFact.subject" = "a subject key from the user's own words"
"UserFact.scope" = "a topic, repository or app key"
"SnapshotManifest.files[][1]" = "a path inside the session's snapshot folder, which Eileen wrote"
"SnapshotManifest.files[][2]" = "a BLAKE3 hex digest"
"LearnEvent.snapshot_tampered.file" = "a path inside the session's snapshot folder, which Eileen wrote"
"RouteProposal.app" = "a key of Eileen's app index, validated by the dispatcher (section 3.3.13)"
"RouteProposal.registry_id" = "a registry id in a validated format (section 3.3.13)"
"Publisher.namespace" = "a registry-verified namespace in a validated format (section 3.3.13)"
"Publisher.display" = "what Eileen derived from the verified namespace to show and speak"
"McpPackage.version" = "an exact semantic version, validated (section 3.3.13)"
"RouteStat.app" = "a key of Eileen's app index"
"RouteStat.app_major" = "the app's major version"
"RouteStat.task" = "a task class key, enum-like"
"SourceStat.host" = "a registrable domain, validated (section 3.3.13)"
