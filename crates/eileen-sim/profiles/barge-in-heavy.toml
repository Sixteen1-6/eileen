# Barge-in heavy (BUILD.md section 4.7): mostly speech, long answers from the brain, and the
# user talking over Eileen most of the time she speaks, so ducks, pauses, resumes and stops
# come often. Schema: profile.schema.json beside it.
name = "barge-in-heavy"
steps = 2000
seeds = 64
max_step_ms = 100
speech_queue_max = 8
bus_subscriber_capacity = 64
bus_subscriber_drain = 2
barge_in_pct = 70

[input_mix]
voice = 10
user = 1
playback = 1
timer = 2
activity = 1

[pc]
physical_mb = 16384
commit_limit_mb = 24576
others_mb = 8000
others_commit_mb = 9000
largest = "browser"
largest_mb = 2500
paging_floor_mb = 1000
paging_kb_s_per_mb = 40
paging_limit_kb_s = 4000
cpu_busy_pct = 10
power = "ac"

[eileen]
core = 60
speech = 1250
brain = 400
worker = 400

# The first text comes sooner but varies, so a window often lands just as a reply starts.
[brain]
first_ms = 300
first_jitter_ms = 900
delta_ms = 120
dispatch_pct = 0
stall_ms = 30000

[faults]
activate_per_mille = 250
fire_per_mille = 10
