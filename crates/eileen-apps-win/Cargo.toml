[package]
name = "eileen-apps-win"
description = "Eileen's app backends on Windows: Office, Explorer and Photoshop over COM, the Resolve gate, SMTC and recent files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "apps"
owns = "WP6"
unsafe = "ffi"

# Windows only, as the -linux crates are Linux only: off Windows the crate is empty and has no
# dependencies.
[target.'cfg(windows)'.dependencies]
eileen-contracts.workspace = true
eileen-platform.workspace = true
serde_json.workspace = true

[lints]
workspace = true
