[package]
name = "eileen-desktop-win"
description = "Eileen's desktop backend on Windows: UI Automation, input, capture, windows, launch and the system volume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "desktop"
owns = "WP5"
unsafe = "ffi"

# Windows only, as the -linux crates are Linux only: off Windows the crate is empty and has no
# dependencies.
[target.'cfg(windows)'.dependencies]
eileen-contracts.workspace = true
eileen-platform.workspace = true

[lints]
workspace = true
