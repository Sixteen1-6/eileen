[package]
name = "eileen-speech"
description = "Eileen's speech process: voice activity, recognition, end of turn, synthesis, voices and the speech pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "speech"
owns = "WP4"
unsafe = "forbid"

# sherpa-onnx and ort are native libraries of BUILD.md section 4.1, declared from W0 so their
# build failures show up before WP4 uses them; the stub does not use them yet.
[package.metadata.cargo-machete]
ignored = ["ort", "sherpa-onnx"]

[[bin]]
name = "eileen-speech"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
ort.workspace = true
sherpa-onnx.workspace = true

[lints]
workspace = true
