[package]
name = "eileen-harness"
description = "Eileen's drivers for vendor CLIs: Claude workers and the brain, with the Codex, ACP and other routes as slots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "core"
owns = "WP3"
unsafe = "forbid"

[dependencies]
clap.workspace = true
eileen-contracts.workspace = true
# The runtime `eileen doctor claude` runs its probes on.
eileen-rt.workspace = true
# Every probe the doctor starts (`claude auth status`, `claude --version`, vswhere).
eileen-supervisor.workspace = true
# The Redactor, which every tool input passes through before it leaves the stream parser.
eileen-trace.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The doctor's deadlines and its read of a probe's output.
tokio.workspace = true
# The worker driver's `worker.refused` and `worker.fault` logs.
tracing.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
