[package]
name = "eileen-buildguard"
description = "Build slots with memory admission for the owner's PC: shared memory samples, the baseline, guarded cargo spawns and the desktop lock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "tools, core"
owns = "WP0"
unsafe = "ffi"

# std and windows-sys only (BUILD.md section 3.1), so xtask stays a seconds-long compile.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
