[package]
name = "eileen-supervisor"
description = "How Eileen starts every child: a kill-on-close Job Object, no console window, stderr into tracing, deadlines, heartbeats, bounded restarts, and the guard's detached spawn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "all"
owns = "WP0"
unsafe = "ffi"

[dependencies]
eileen-rt.workspace = true
# Named threads: the detached spawn's reaper on Unix, the fork thread on Linux, and the stderr
# reader on Windows.
eileen-stdx.workspace = true
eileen-trace.workspace = true
# process-group: each child leads a process group of its own on Unix systems other than Linux.
# Linux has its own process model in the linux module (docs/LINUX.md section 5).
process-wrap = { workspace = true, features = ["process-group"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# rustix's process feature gives setsid, the parent-death signal, pidfds, waitid and killpg as
# safe calls.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
eileen-trace = { workspace = true, features = ["testing"] }

[lints]
workspace = true
