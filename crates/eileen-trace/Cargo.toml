[package]
name = "eileen-trace"
description = "Tracing for every Eileen process: sinks, span names and their parent table, the pii policy, the Redactor, the flight recorder and the scenario privacy rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "all"
owns = "WP0"
unsafe = "forbid"

[features]
# `test_support`, the capture layer and `assert_schema_ok`, for other crates' tests. Only
# dev-dependencies turn it on, so no shipped binary carries it.
testing = []

[dependencies]
blake3.workspace = true
eileen-contracts.workspace = true
eileen-stdx.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The scenario privacy rules parse scenario.toml into the contracts' Scenario.
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
eileen-trace = { workspace = true, features = ["testing"] }

[lints]
workspace = true
