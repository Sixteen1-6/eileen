[package]
name = "eileen-apps"
description = "Eileen's app adapters sidecar: Resolve, media, Office, Explorer, recent files, images and route lookup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "apps"
owns = "WP6"
unsafe = "forbid"

# ort is a native library of BUILD.md section 4.1 (the face model, YuNet), declared from W0 so
# its build failures show up before WP6 uses it; the stub does not use it yet.
[package.metadata.cargo-machete]
ignored = ["ort"]

[[bin]]
name = "eileen-apps"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
ort.workspace = true

[lints]
workspace = true
