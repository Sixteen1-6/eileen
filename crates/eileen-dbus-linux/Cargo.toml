[package]
name = "eileen-dbus-linux"
description = "The D-Bus helpers every Linux crate shares: the error type, the buses, name owners and signal streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "all"
owns = "WP10"
unsafe = "forbid"

[features]
# The private bus and the fake-service helpers for tests (module `testing`). Only
# dev-dependencies turn it on: it starts a dbus-daemon, which product code never does.
private-bus = []

# Linux only, as the -win crates are Windows only: off Linux the crate is empty and has no
# dependencies (docs/LINUX.md section 4).
[target.'cfg(target_os = "linux")'.dependencies]
thiserror.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
eileen-dbus-linux = { workspace = true, features = ["private-bus"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
