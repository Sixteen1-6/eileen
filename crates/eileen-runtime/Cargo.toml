[package]
name = "eileen-runtime"
description = "Eileen's driver loop around the core: the store, the bus, the sampler, the loopback endpoint and the dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.eileen]
process = "core"
owns = "WP2"
unsafe = "forbid"

[dependencies]
clap.workspace = true
eileen-contracts.workspace = true
eileen-core.workspace = true
eileen-rt.workspace = true
eileen-stdx.workspace = true
eileen-trace.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
eileen-trace = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
